spring:
  # Optional .env.local (gitignored) in the working dir, e.g. Neon credentials.
  # Without it, falls back to the Docker Postgres from compose.yaml.
  config:
    import: optional:file:./.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/supportdesk}
    username: ${DB_USERNAME:supportdesk}
    password: ${DB_PASSWORD:supportdesk}
  # db/seed holds local-only staff accounts; prod runs db/migration alone.
  flyway:
    locations: classpath:db/migration,classpath:db/seed

supportdesk:
  auth:
    jwt-secret: ${JWT_SECRET:jZ8KyrG8AdOwr22aPCs2YRwz5tpFCDwEC3BdV5aEnZjKl6/bwAanV0WBD7GQMpfq}
    allow-plain-password: true        # so Swagger "Try it out" and Postman can send Password123! as is
