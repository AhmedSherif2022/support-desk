spring:
  application:
    name: support-desk
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

supportdesk:
  auth:
    jwt-secret: ${JWT_SECRET}
    session-timeout: 30m
    max-failed-attempts: 5
    lock-duration: 15m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}