server:
  port: ${PORT:8080}                # Railway injects PORT

spring:
  application:
    name: support-desk
  profiles:
    default: local
  docker:
    compose:
      enabled: false
  # No defaults: production must supply these (Railway service variables).
  # The local profile overrides them with Docker / .env.local values.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
    schemas: public
  data:
    web:
      pageable:
        max-page-size: 100            # e.g. GET /api/audit/logs?size=...

supportdesk:
  auth:
    jwt-secret: ${JWT_SECRET}
    session-timeout: 15m              # access token (JWT) lifetime
    max-failed-attempts: 5
    lock-duration: 15m
    failure-window: 15m               # max-failed-attempts must happen within this to lock
    inactivity-timeout: 30m           # no refresh for this long ends the session (refresh token expires)
    allow-plain-password: false       # the frontend must send SHA-256(password); only the local profile relaxes this
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
  tickets:
    sla:
      warning-at-percent: 75          # at or above this, and still under the target, the ticket is AT_RISK
      targets:
        CRITICAL: 2h
        HIGH: 8h
        MEDIUM: 24h
        LOW: 72h

springdoc:
  swagger-ui:
    persist-authorization: true   # keep the pasted token when the Swagger page reloads
    tags-sorter: alpha
