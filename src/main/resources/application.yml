server:
  port: ${PORT:8080}                # Railway injects PORT

spring:
  application:
    name: support-desk
  profiles:
    default: local
  docker:
    compose:
      enabled: false
  # No defaults: production must supply these (Railway service variables).
  # The local profile overrides them with Docker / .env.local values.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    default-schema: public
    schemas: public
  data:
    web:
      pageable:
        max-page-size: 100            # e.g. GET /api/audit/logs?size=...

supportdesk:
  auth:
    jwt-secret: ${JWT_SECRET}
    session-timeout: 15m              # access token (JWT) lifetime
    max-failed-attempts: 5
    lock-duration: 15m
    failure-window: 15m               # max-failed-attempts must happen within this to lock
    inactivity-timeout: 30m           # no refresh for this long ends the session (refresh token expires)
    allow-plain-password: false       # the frontend must send SHA-256(password); only the local profile relaxes this
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://localhost:3000}
  tickets:
    sla:
      warning-at-percent: 75          # at or above this, and still under the target, the ticket is AT_RISK
      targets:
        CRITICAL: 2h
        HIGH: 8h
        MEDIUM: 24h
        LOW: 72h
  monitor:
    enabled: true
    interval: 1m
    batch-size: 100
    duplicate-window: 24h
  azure:                              # E5 Azure DevOps; secrets come from environment variables only
    mode: ${AZURE_MODE:OFF}           # OFF: escalations wait as "pending"; REST: real Azure DevOps; FAKE: local/tests
    organization: ${AZURE_ORG:}
    project: ${AZURE_PROJECT:}
    work-item-type: ${AZURE_WORK_ITEM_TYPE:Bug}
    personal-access-token: ${AZURE_PAT:}
    portal-base-url: ${PORTAL_BASE_URL:http://localhost:4200}
    customer-token-secret: ${AZURE_CUSTOMER_TOKEN_SECRET:${JWT_SECRET}}   # HMAC key for the masked customer token
    outbox:
      poll-interval: 15s
      batch-size: 20
      max-attempts: 10                # E5-S3: then FAILED + failed-integration alert
      first-retry-delay: 30s          # doubles after each failure ...
      max-retry-delay: 1h             # ... up to this

springdoc:
  swagger-ui:
    persist-authorization: true   # keep the pasted token when the Swagger page reloads
    tags-sorter: alpha