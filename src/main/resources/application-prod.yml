spring:
  flyway:
    # Neon production was first migrated with the local profile, so its history
    # includes the db/seed repeatables (R__seed_*). Prod doesn't ship db/seed;
    # don't fail validation over those missing scripts.
    ignore-migration-patterns: "*:missing,*:future"

server:
  # Railway ends HTTPS at its proxy: honour X-Forwarded-Proto so Swagger's server URL is https
  # (an http URL makes "Try it out" fail as mixed content).
  forward-headers-strategy: framework
